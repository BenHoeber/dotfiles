# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 20
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
csv = [
    { run = "/home/bhoeber/.local/bin/visidata %s", block = true, desc = "VisiData Data viewer" },
]
csv_de = [
    { run = "LC_NUMERIC=de_DE.UTF-8 /home/bhoeber/.local/bin/visidata %s --csv_delimiter=';'", block = true, desc = "VisiData for German CSVs" },
]
parquet = [
    { run = "/home/bhoeber/.local/bin/visidata %s", block = true, desc = "VisiData" },
]
json = [
    { run = "fx %s1", block = true, desc = "fx JSON viewer" },
]
zathura = [
    { run = "zathura %s", orphan = true, desc = "Zathura PDF viewer" },
]
okular = [
    { run = "okular %s", orphan = true, desc = "Okular PDF viewer" },
]

[open]
prepend_rules = [
    # HTML: edit first, but allow external opening
    { mime = "text/html", use = ["edit", "open", "reveal"] },

    # CSV
    { url = "*.{csv,CSV}", use = ["edit", "csv", "csv_de", "reveal"] },
    { mime = "text/csv", use = ["csv", "csv_de", "edit", "reveal"] },

    # JSON
    { url = "*.{json,JSON}", use = ["edit", "json", "reveal"] },

    # Parquet
    { url = "*.parquet", use = ["parquet", "reveal"] },
    { mime = "application/vnd.apache.parquet", use = ["parquet", "reveal"] },

    # PDFs
    { mime = "application/pdf", use = ["zathura", "okular", "open", "reveal"] },
]

[tasks]
bizarre_retry = 3
image_alloc = 536870912
image_bound = [5000, 5000]
suppress_preload = false

[plugin]
prepend_fetchers = [
    { group = "git", url = "*", run = "git" },
    { group = "git", url = "*/", run = "git" },
]

[input]
cursor_blink = false
program = "/bin/zsh"

cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

quit_title = "Quit?"
quit_content = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 70, 20]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
