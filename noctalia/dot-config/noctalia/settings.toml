[nightlight]
enabled = true

[notification]
history_retention_hours = 18
layer = "overlay"
offset_x = 8
offset_y = 10

[osd]
offset_y = 20

[plugin_settings."apex077/eyecare"]
active_duration_minutes = 30

[plugin_settings."blackbartblues/audio-switcher"]
audio-switcher_open_near_click = false
audio-switcher_position = "center"

[plugin_settings."davemhammer/obsidian"]
manager_placement = "attached"
refresh_interval = 120
vault_path = "~/Documents/My Vault"

[plugins]
enabled = [ "aristides/udiskie", "blackbartblues/audio-switcher", "apex077/eyecare", "davemhammer/obsidian" ]

[shell]
clipboard_history_max_entries = 3000

    [shell.launcher.providers.session]
    prefix = ""

    [shell.launcher.providers.windows]
    global = false

    [shell.panel]
    floating_offset = 100
    list_item_background = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/bhoeber/Pictures/Screenshots/gantt"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "d"
    variant = "destructive"

[system.monitor]
disk_poll_seconds = 30
ram_pct_activity_threshold = 40
ram_pct_critical_threshold = 85

[theme]
source = "wallpaper"

[wallpaper]
directory = "/home/bhoeber/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/bhoeber/Pictures/Wallpapers/wallpaper3.jpg"

    [wallpaper.last]
    path = "/home/bhoeber/Pictures/Wallpapers/wallpaper3.jpg"

[weather]
refresh_minutes = 240

[widget.date]
scale = 0.80000000000000004

[widget.eyecare-widget]
type = "apex077/eyecare:eyecare-widget"

[widget.keyboard_layout]
show_glyph = false

    [widget.keyboard_layout.actions]
    right = "keyboard-backlight-toggle"

[widget.launcher]
glyph = "rocket"

[widget.media]
capsule_padding = 5
hide_when_no_media = true
scale = 0.80000000000000004
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
scale = 0.80000000000000004
stat = "ram_pct"
visualization = "none"

[widget.session]
color = "error"

[widget.status]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.status_2]
type = "davemhammer/obsidian:status"

[widget.sysmon]
capsule = true
capsule_radius = "auto"
scale = 0.80000000000000004
visualization = "none"

[widget.taskbar]
capsule = true
capsule_fill = "surface"
capsule_padding = 3
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.69999999999999996
scale = 1.1000000000000001
show_active_indicator = false
show_workspace_label = false

[widget.tray]
hidden = [ "Network", "Blueman" ]

[widget.volume]
mute_color = "on_surface_variant"

[widget.widget]
type = "blackbartblues/audio-switcher:widget"

    [widget.widget.actions]
    middle = "volume-mute"

[widget.workspaces]
enabled = false
focused_output_only = true
labels_only_when_occupied = true
scale = 1.25