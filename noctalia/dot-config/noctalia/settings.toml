config_version = 12

[accessibility]
ui_scale = 1.1500000096857548

[audio]
enable_overdrive = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.3899999912828207
    capsule = true
    capsule_opacity = 0.34999999217689037
    capsule_thickness = 0.82999998517334461
    center = [ "taskbar", "eyecare-widget", "status_2" ]
    contact_shadow = true
    end = [
        "notifications",
        "tray",
        "keyboard_layout",
        "network",
        "bluetooth",
        "status",
        "widget",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    margin_edge = 3
    margin_ends = 5
    padding = 4
    radius = 19
    scale = 1.2500000111758709
    start = [ "launcher", "clock", "date", "ram", "sysmon", "media" ]
    thickness = 38
    widget_spacing = 8

        [bar.default.dead_zone.actions]
        middle = "settings-toggle"
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

[brightness]
enable_ddcutil = true
minimum_brightness = 0.1099999975413084
sync_all_monitors = true

[control_center]
width = 800

    [control_center.calendar]
    show_events_card = false
    show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.39999999105930328
enabled = true
reserve_space = false
show_dots = true

[idle]
pre_action_fade_seconds = 5

[location]
address = "Germany, Heidelberg"

